name: Build Android Kernel

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Select config file'
        required: true
        default: 'repos.ursa.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install pyyaml

      - name: Run kernel builder
        run: |
          if [ -f "build.py" ]; then
            python3 build.py ${{ github.event.inputs.config }}
          else
            echo "build.py not found!"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm/boot/zImage
            out/arch/arm/boot/Image
            out/arch/arm/boot/Image.gz-dtb
          if-no-files-found: ignore
